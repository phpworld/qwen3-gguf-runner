
name: Qwen3-8B-GGUF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential libcurl4-openssl-dev

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          cmake -B build -DGGML_CURL=ON
          cmake --build build --config Release -j2 --target llama-cli

      - name: Download and run Qwen3-8B
        run: |
          ./llama.cpp/build/bin/llama-cli \
            -hf Qwen/Qwen3-8B-GGUF:Q4_K_M \
            -c 2048 \
            -n 128 \
            -p "Write a simple PHP function to add two numbers."
